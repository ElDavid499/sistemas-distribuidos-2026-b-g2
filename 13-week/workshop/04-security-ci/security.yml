# Security gates proposed for the Salud Activa backend (Node.js / Express).
# Copy to .github/workflows/security.yml in the backend code repository when the team approves it.
name: security

on:
  pull_request:
    branches: [main, develop, qa]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev

  authz-tests:
    name: Negative authorization tests (/api/turnos)
    runs-on: ubuntu-latest
    needs: [secret-scan]
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      PORT: "10000"
      MONGODB_URI: mongodb://localhost:27017/salud_activa_ci
      JWT_SECRET: ci-only-not-a-real-secret
      BASE_URL: http://localhost:10000
      REGISTER_USERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Start backend in background
        working-directory: backend
        run: |
          nohup node server.js > ../server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "$BASE_URL/api/status" && exit 0
            sleep 1
          done
          cat ../server.log
          exit 1
      - name: Run turnos authorization tests
        run: node --test tests/security/turnos-authz.test.js
      - name: Show backend log on failure
        if: failure()
        run: cat server.log
